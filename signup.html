<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinkedIn Sign Up</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- My CSS -->
    <link rel="stylesheet" href="sty.css">
</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <!-- Left Section -->
            <div class="col-5 section1 d-flex flex-column justify-content-center align-items-center">

                <h2>Join LinkedIn</h2>

                <p>
                    Create an account to connect with
                    professionals and find opportunities.
                </p>

                <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png"
                    alt="LinkedIn"
                    class="img-fluid linkedin-image" width="50%">

            </div>


            <!-- Right Section -->
            <div class="col-7 section2">

                <h2>Sign Up</h2>


                <!-- First Name -->
                <div class="mb-3">

                    <label for="firstName" class="form-label">
                        First Name
                    </label>

                    <input type="text"
                        class="form-control"
                        id="firstName"
                        placeholder="Enter First Name">

                </div>


                <!-- Last Name -->
                <div class="mb-3">

                    <label for="lastName" class="form-label">
                        Last Name
                    </label>

                    <input type="text"
                        class="form-control"
                        id="lastName"
                        placeholder="Enter Last Name">

                </div>


                <!-- Email -->
                <div class="mb-3">

                    <label for="email" class="form-label">
                        Email
                    </label>

                    <input type="email"
                        class="form-control"
                        id="email"
                        placeholder="Enter Email">

                </div>


                <!-- Password -->
                <div class="mb-3">

                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input type="password"
                        class="form-control"
                        id="password"
                        placeholder="Enter Password">

                </div>


                <!-- Confirm Password -->
                <div class="mb-3">

                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>

                    <input type="password"
                        class="form-control"
                        id="confirmPassword"
                        placeholder="Confirm Password">

                </div>


                <!-- Sign Up Button -->
                <button type="button" class="btn btn-primary w-100">
                    SIGN UP
                </button>


                <!-- Login Link -->
                <p class="text-center mt-3">

                    Already have an account?

                    <a href="login.html">
                        Sign in
                    </a>

                </p>

            </div>

        </div>

    </div>

</body>

</html>
