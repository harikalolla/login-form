<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinkedIn Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- My CSS -->
    <link rel="stylesheet" href="sty.css">
</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <!-- Left Section -->
            <div class="col-5 section1 d-flex flex-column justify-content-center align-items-center">

                <h2>Welcome Back!</h2>

                <p>
                    Sign in to access your professional world,
                    connections and opportunities.
                </p>

                <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png"
                    alt="LinkedIn"
                    class="img-fluid linkedin-image" width="50%">

            </div>


            <!-- Right Section -->
            <div class="col-7 section2">

                <h2>Sign In</h2>

                <!-- Email -->
                <div class="mb-3">

                    <label for="email" class="form-label">
                        Email or Phone
                    </label>

                    <input type="text"
                        class="form-control"
                        id="email"
                        placeholder="Enter Email or Phone">

                </div>


                <!-- Password -->
                <div class="mb-3">

                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input type="password"
                        class="form-control"
                        id="password"
                        placeholder="Enter Password">

                </div>


                <!-- Forgot Password -->
                <p>
                    <a href="#" class="forgot">
                        Forgot password?
                    </a>
                </p>


                <!-- Sign In Button -->
                <button type="button" class="btn btn-primary w-100">
                    SIGN IN
                </button>


                <!-- Sign Up Link -->
                <p class="text-center mt-3">
                    New to LinkedIn?
                    <a href="signup.html">Join now</a>
                </p>

            </div>

        </div>

    </div>

</body>

</html>
